# NAS Container Manager에 이 파일 그대로 등록해서 쓴다.
# 이미지: 이 디렉터리에서 `docker build -t scanvoca-clipper .` 후
#         `docker save scanvoca-clipper -o scanvoca-clipper.tar`로 export한 뒤
#         NAS에 업로드하고 Container Manager > 이미지에서 가져오기(import)로 등록한다.
#
# CLIPPER_LOOP_SECONDS를 .env에 설정하면(예: 604800 = 7일) 컨테이너가 스스로
# "1회 실행 -> N초 대기 -> 재실행"을 반복한다 — 이 값이 0이거나 없으면 한 번 실행하고
# 종료하므로, NAS 스케줄러로 직접 기동하는 방식과도 그대로 호환된다.
#
# 아래 volumes의 왼쪽(호스트) 경로는 실제 NAS 폴더 구조에 맞게 바꿔야 한다. 오른쪽
# (컨테이너 내부) 경로는 .env의 NAS_SOURCE_DIR / NAS_OUTPUT_DIR 값과 반드시 일치해야
# 한다 — 이 compose.yaml은 컨테이너 안에서 그 경로들이 실제로 존재하게 만들어주는
# 역할만 하고, 그 경로 문자열 자체는 여전히 .env가 정의한다.
services:
  clipper:
    image: scanvoca-clipper:latest
    container_name: scanvoca-clipper
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - /volume1/video/conversation-source:/source   # NAS_SOURCE_DIR과 동일해야 함
      - /volume1/video/conversation-output:/output    # NAS_OUTPUT_DIR과 동일해야 함
